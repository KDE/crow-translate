# Read by KDE's Craft jobs (the AppImage, the Windows package) on top of the blueprint.
#
# The blueprint still asks for KWayland, which Crow no longer uses and which Craft can no
# longer build for Linux (KWayland 6.8 wants Wayland 1.26, Craft has 1.24), and it does not
# ask for KWindowSystem yet, which Crow uses instead. Until it does, the AppImage is built
# without either: requests to the desktop portal are then made without a parent window.
# This file goes when the blueprint has caught up.
[linux-64-gcc-BlueprintSettings]
kde/plasma/kwayland.ignored = True
extragear/crow-translate.args = -DWITH_KWINDOWSYSTEM=OFF
